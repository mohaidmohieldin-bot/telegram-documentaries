[project]
name = "telegram-documentaries"
version = "0.1.0"
description = "Telegram bot that turns a portrait into a narrated comedy wildlife documentary."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=22.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "google-adk>=1.10",
]

[project.scripts]
telegram-documentaries = "telegram_documentaries.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_documentaries"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = [
    "live: calls the real Gemini API (opt-in, run with scripts/test-live)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE", "S110", "S112"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["telegram_documentaries", "tests"]
